      <stop offset="0%" style="stop-color:hsl(216, 72%, 21%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(19, 94%, 55%);stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg-masterclass-timbaland-teaches-producing-and-beatmaking)" />
  <!-- Subtle texture overlay -->
  <rect width="1200" height="630" fill="hsl(0, 0%, 100%)" opacity="0.04" />
  <!-- Bottom bar with brand name -->
  <rect x="0" y="558" width="1200" height="72" fill="hsl(0, 0%, 7%)" opacity="0.55" />
  <text x="60" y="602" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="22" fill="hsl(0, 0%, 100%)" opacity="0.90">Luthas Center for Excellence</text>
  <!-- Type badge -->
  <rect x="60" y="48" width="112" height="34" rx="4" fill="hsl(19, 94%, 55%)" opacity="0.90" />
  <text x="116" y="70" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="14" fill="hsl(0, 0%, 100%)" letter-spacing="2">COURSE</text>
  <!-- Title text -->
  <text x="600" y="273" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Masterclass: Timbaland</text>
  <text x="600" y="325" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Teaches Producing and</text>
  <text x="600" y="377" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Beatmaking</text>
