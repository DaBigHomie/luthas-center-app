<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Supporting Your Mental Health While Working from Home">
  <defs>
    <linearGradient id="bg-supporting-your-mental-health-while-working-from-home" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(216, 72%, 21%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(0, 0%, 7%);stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg-supporting-your-mental-health-while-working-from-home)" />
  <!-- Subtle texture overlay -->
  <rect width="1200" height="630" fill="hsl(0, 0%, 100%)" opacity="0.04" />
  <!-- Bottom bar with brand name -->
  <rect x="0" y="558" width="1200" height="72" fill="hsl(0, 0%, 7%)" opacity="0.55" />
  <text x="60" y="602" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="22" fill="hsl(0, 0%, 100%)" opacity="0.90">Luthas Center for Excellence</text>
  <!-- Type badge -->
  <rect x="60" y="48" width="112" height="34" rx="4" fill="hsl(19, 94%, 55%)" opacity="0.90" />
  <text x="116" y="70" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="14" fill="hsl(0, 0%, 100%)" letter-spacing="2">COURSE</text>
  <!-- Title text -->
  <text x="600" y="273" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Supporting Your Mental</text>
  <text x="600" y="325" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Health While Working</text>
  <text x="600" y="377" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">from Home</text>
</svg>