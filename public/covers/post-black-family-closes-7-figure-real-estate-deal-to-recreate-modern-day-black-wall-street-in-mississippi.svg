  <text x="600" y="351" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Deal to Recreate</text>
  <text x="600" y="403" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-weight="700" font-size="38" fill="hsl(0, 0%, 100%)" opacity="0.97">Modern-Day Black Wall…</text>
</svg>