<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mom and Daughter, Owners of Black-Owned Greek Paraphernalia Store, Celebrate 35 Years in Business">
